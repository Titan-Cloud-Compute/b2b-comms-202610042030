openapi: 3.0.3
info:
  title: Vendor and Customer Workspace Portal
  version: '1.0.0'
paths:
  /api/admin/audit-log:
    get:
      summary: audit-log
      operationId: getApiAdminAuditLog
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetApiAdminAuditLogResponse'
    post:
      summary: audit-log
      operationId: postApiAdminAuditLog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostApiAdminAuditLogRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostApiAdminAuditLogResponse'
  /api/admin/customers:
    get:
      summary: customer-invite
      operationId: getApiAdminCustomers
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetApiAdminCustomersResponse'
  /api/admin/customers/invite:
    post:
      summary: customer-invite
      operationId: postApiAdminCustomersInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostApiAdminCustomersInviteRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostApiAdminCustomersInviteResponse'
  /api/channels:
    get:
      summary: shared-channel
      operationId: getApiChannels
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetApiChannelsResponse'
    post:
      summary: shared-channel
      operationId: postApiChannels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostApiChannelsRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostApiChannelsResponse'
  '/api/channels/{id}/messages':
    post:
      summary: shared-channel
      operationId: postApiChannelsByIdMessages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostApiChannelsByIdMessagesRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostApiChannelsByIdMessagesResponse'
  /api/invoices:
    post:
      summary: invoice-generation
      operationId: postApiInvoices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostApiInvoicesRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostApiInvoicesResponse'
  '/api/invoices/{id}/download':
    get:
      summary: invoice-generation
      operationId: getApiInvoicesByIdDownload
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetApiInvoicesByIdDownloadResponse'
  /api/notifications/preferences:
    get:
      summary: notification-preferences
      operationId: getApiNotificationsPreferences
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetApiNotificationsPreferencesResponse'
    put:
      summary: notification-preferences
      operationId: putApiNotificationsPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutApiNotificationsPreferencesRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutApiNotificationsPreferencesResponse'
  /api/orders:
    get:
      summary: order-management
      operationId: getApiOrders
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetApiOrdersResponse'
    post:
      summary: order-management
      operationId: postApiOrders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostApiOrdersRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostApiOrdersResponse'
  '/api/orders/{id}/confirm':
    patch:
      summary: order-management
      operationId: patchApiOrdersByIdConfirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchApiOrdersByIdConfirmRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchApiOrdersByIdConfirmResponse'
  /api/vendor/documents:
    get:
      summary: vendor-onboarding
      operationId: getApiVendorDocuments
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetApiVendorDocumentsResponse'
    post:
      summary: vendor-onboarding
      operationId: postApiVendorDocuments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostApiVendorDocumentsRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostApiVendorDocumentsResponse'
  /api/vendor/profile:
    post:
      summary: vendor-onboarding
      operationId: postApiVendorProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostApiVendorProfileRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostApiVendorProfileResponse'
components:
  schemas:
    AuditEntry:
      type: object
      required:
        - action
        - createdAt
        - id
        - userId
      properties:
        action:
          type: string
        createdAt:
          type: string
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
    Channel:
      type: object
      required:
        - id
        - name
        - vendorId
        - vendorProfileId
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        vendorId:
          type: string
          format: uuid
        vendorProfileId:
          type: string
    Customer:
      type: object
      required:
        - email
        - id
        - userId
        - userId
      properties:
        email:
          type: string
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        userId:
          type: string
    Document:
      type: object
      required:
        - filename
        - id
        - status
        - vendorProfileId
        - vendorProfileId
      properties:
        filename:
          type: string
        id:
          type: string
          format: uuid
        status:
          type: string
        vendorProfileId:
          type: string
          format: uuid
        vendorProfileId:
          type: string
    Invoice:
      type: object
      required:
        - amount
        - id
        - orderId
        - orderId
      properties:
        amount:
          type: string
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        orderId:
          type: string
    Message:
      type: object
      required:
        - body
        - channelId
        - channelId
        - id
        - senderId
      properties:
        body:
          type: string
        channelId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
        channelId:
          type: string
    NotificationPreference:
      type: object
      required:
        - id
        - messageAlerts
        - orderAlerts
        - userId
        - userId
      properties:
        id:
          type: string
          format: uuid
        messageAlerts:
          type: boolean
        orderAlerts:
          type: boolean
        userId:
          type: string
          format: uuid
        userId:
          type: string
    Order:
      type: object
      required:
        - customerId
        - customerId
        - id
        - status
        - vendorId
      properties:
        customerId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        status:
          type: string
        vendorId:
          type: string
          format: uuid
        customerId:
          type: string
    OrderItem:
      type: object
      required:
        - description
        - id
        - orderId
        - orderId
        - quantity
        - unitPrice
      properties:
        description:
          type: string
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        quantity:
          type: integer
        unitPrice:
          type: string
        orderId:
          type: string
    User:
      type: object
      required:
        - createdAt
        - email
        - id
        - role
      properties:
        createdAt:
          type: string
        email:
          type: string
        id:
          type: string
          format: uuid
        role:
          type: string
    VendorProfile:
      type: object
      required:
        - companyName
        - contactEmail
        - id
        - userId
        - userId
      properties:
        companyName:
          type: string
        contactEmail:
          type: string
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        userId:
          type: string
    GetApiAdminAuditLogResponse:
      type: object
      required:
        - action
        - createdAt
        - id
        - userId
      properties:
        action:
          type: string
        createdAt:
          type: string
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
    GetApiAdminCustomersResponse:
      type: object
      required:
        - email
        - id
      properties:
        email:
          type: string
        id:
          type: string
          format: uuid
    GetApiChannelsResponse:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    GetApiInvoicesByIdDownloadResponse:
      type: object
      required:
        - downloadUrl
        - id
      properties:
        downloadUrl:
          type: string
        id:
          type: string
          format: uuid
    GetApiNotificationsPreferencesResponse:
      type: object
      required:
        - messageAlerts
        - orderAlerts
        - userId
      properties:
        messageAlerts:
          type: boolean
        orderAlerts:
          type: boolean
        userId:
          type: string
          format: uuid
    GetApiOrdersResponse:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
    GetApiVendorDocumentsResponse:
      type: object
      required:
        - filename
        - id
        - status
      properties:
        filename:
          type: string
        id:
          type: string
          format: uuid
        status:
          type: string
    PatchApiOrdersByIdConfirmRequest:
      type: object
      required:
        - estimatedDelivery
      properties:
        estimatedDelivery:
          type: string
          format: date-time
    PatchApiOrdersByIdConfirmResponse:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
    PostApiAdminAuditLogRequest:
      type: object
      required:
        - action
        - userId
      properties:
        action:
          type: string
        userId:
          type: string
          format: uuid
    PostApiAdminAuditLogResponse:
      type: object
      required:
        - action
        - createdAt
        - id
      properties:
        action:
          type: string
        createdAt:
          type: string
        id:
          type: string
          format: uuid
    PostApiAdminCustomersInviteRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
    PostApiAdminCustomersInviteResponse:
      type: object
      required:
        - customerId
        - email
        - invitationSent
      properties:
        customerId:
          type: string
          format: uuid
        email:
          type: string
        invitationSent:
          type: boolean
    PostApiChannelsRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    PostApiChannelsResponse:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    PostApiChannelsByIdMessagesRequest:
      type: object
      required:
        - body
      properties:
        body:
          type: string
    PostApiChannelsByIdMessagesResponse:
      type: object
      required:
        - body
        - channelId
        - id
      properties:
        body:
          type: string
        channelId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
    PostApiInvoicesRequest:
      type: object
      required:
        - amount
        - orderId
      properties:
        amount:
          type: string
        orderId:
          type: string
          format: uuid
    PostApiInvoicesResponse:
      type: object
      required:
        - amount
        - id
        - orderId
      properties:
        amount:
          type: string
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
    PostApiOrdersRequest:
      type: object
      required:
        - vendorId
      properties:
        vendorId:
          type: string
          format: uuid
    PostApiOrdersResponse:
      type: object
      required:
        - customerId
        - id
        - status
      properties:
        customerId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        status:
          type: string
    PostApiVendorDocumentsRequest:
      type: object
      required:
        - filename
      properties:
        filename:
          type: string
    PostApiVendorDocumentsResponse:
      type: object
      required:
        - filename
        - id
        - status
      properties:
        filename:
          type: string
        id:
          type: string
          format: uuid
        status:
          type: string
    PostApiVendorProfileRequest:
      type: object
      required:
        - companyName
        - contactEmail
      properties:
        companyName:
          type: string
        contactEmail:
          type: string
    PostApiVendorProfileResponse:
      type: object
      required:
        - companyName
        - contactEmail
        - id
      properties:
        companyName:
          type: string
        contactEmail:
          type: string
        id:
          type: string
          format: uuid
    PutApiNotificationsPreferencesRequest:
      type: object
      required:
        - messageAlerts
        - orderAlerts
      properties:
        messageAlerts:
          type: boolean
        orderAlerts:
          type: boolean
    PutApiNotificationsPreferencesResponse:
      type: object
      required:
        - messageAlerts
        - orderAlerts
        - userId
      properties:
        messageAlerts:
          type: boolean
        orderAlerts:
          type: boolean
        userId:
          type: string
          format: uuid
